<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COP · Operação ao vivo</title>
<!-- Mesmo projeto/sessão de login do COP Analytics (index.html) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
    integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
    crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#eef1f7; --bg2:#e4e9f2; --card:#ffffff; --borda:#d8e0ec;
    --txt:#1e2a3e; --txt2:#5a6b86; --txt3:#8795ad;
    --azul:#2563eb; --verde:#15a06a; --amarelo:#b7791f; --vermelho:#dc2626; --roxo:#7c3aed; --ciano:#0891b2;
  }
  *{ box-sizing:border-box; }
  /* o atributo hidden precisa vencer os display:grid/flex abaixo (senão a tela
     de login nunca some e tampa o painel mesmo depois de logar). */
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0; background:radial-gradient(1200px 700px at 80% -10%, #ffffff 0%, var(--bg) 60%);
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .danger{ color:var(--vermelho); }

  /* ---------- login ---------- */
  #tvLogin{ min-height:100vh; display:grid; place-items:center; padding:24px; }
  .tv-login-card{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--borda);
    border-radius:18px; padding:30px 26px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .tv-login-card h1{ font-size:21px; margin:0 0 4px; }
  .tv-login-card p{ color:var(--txt2); font-size:13.5px; margin:0 0 20px; }
  .tv-login-card label{ display:block; font-size:12.5px; color:var(--txt2); margin:0 0 5px; }
  .tv-login-card input{ width:100%; padding:11px 13px; margin:0 0 14px; border-radius:10px;
    border:1px solid var(--borda); background:var(--bg2); color:var(--txt); font-size:15px; }
  .tv-login-card input:focus{ outline:none; border-color:var(--azul); }
  .tv-senha-wrap{ position:relative; }
  .tv-senha-wrap input{ padding-right:46px; }
  #tvVerSenha{ position:absolute; top:6px; right:6px; width:auto; margin:0; padding:6px 9px;
    background:transparent; color:var(--txt2); font-size:17px; border:none; cursor:pointer; }
  #tvVerSenha:hover{ color:var(--txt); }
  .tv-login-card button{ width:100%; padding:12px; border:none; border-radius:10px; cursor:pointer;
    background:var(--azul); color:#ffffff; font-weight:800; font-size:15px; }
  #tvLoginErro{ color:var(--vermelho); font-size:13px; margin:0 0 12px; }

  /* ---------- cabeçalho ---------- */
  #tvPainel{ min-height:100vh; display:flex; flex-direction:column; padding:18px 22px 10px; }
  .tv-topo{ display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .tv-marca{ font-size:22px; font-weight:800; letter-spacing:.3px; }
  .tv-marca small{ display:block; font-size:12px; font-weight:600; color:var(--txt2); letter-spacing:.08em; text-transform:uppercase; }
  .tv-topo-dir{ margin-left:auto; text-align:right; }
  #tvRelogio{ font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  #tvData{ font-size:12.5px; color:var(--txt2); text-transform:capitalize; }
  #tvErro{ background:#fde4e4; color:#991b1b; border:1px solid #f1b4b4; padding:7px 14px;
    border-radius:10px; font-size:13px; margin-bottom:10px; }

  /* ---------- KPIs ---------- */
  .tv-slide-titulo{ flex:1; text-align:center; font-size:18px; font-weight:800; color:var(--txt2); letter-spacing:.02em; }

  /* ---------- palco (telas girando) ---------- */
  .tv-palco{ flex:1; min-height:0; display:flex; }
  .tv-palco > *{ flex:1; min-height:0; animation:tvFade .45s ease; }
  @keyframes tvFade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  /* tela Panorama (KPIs grandes) */
  .tv-kpis{ display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr; gap:16px; }
  .tv-kpi{ background:var(--card); border:1px solid var(--borda); border-radius:18px;
    padding:22px 26px; display:flex; flex-direction:column; justify-content:center; }
  .tv-kpi.perigo{ border-color:#f0b4b4; background:linear-gradient(180deg,#fdeaea,#ffffff); }
  .tv-kpi-n{ font-size:64px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .tv-kpi.perigo .tv-kpi-n{ color:var(--vermelho); }
  .tv-kpi-rot{ font-size:20px; font-weight:700; margin-top:10px; }
  .tv-kpi-sub{ font-size:14px; color:var(--txt2); margin-top:3px; }

  /* telas de lista (1 ou 2 colunas) */
  .tv-um{ background:var(--card); border:1px solid var(--borda); border-radius:18px; padding:12px 26px; overflow:hidden; }
  .tv-duas{ display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height:0; }
  .tv-tres{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; min-height:0; }
  .tv-col{ background:var(--card); border:1px solid var(--borda); border-radius:18px; padding:12px 22px; overflow:hidden; }

  .tv-item{ display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--borda); }
  .tv-item:last-child{ border-bottom:none; }
  .tv-item-ico{ font-size:26px; flex:none; }
  .tv-item-txt{ min-width:0; flex:1; }
  .tv-item-tit{ font-size:21px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tv-item-sub{ font-size:15px; color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tv-mini{ font-size:14px; font-weight:800; }
  .tv-pill{ flex:none; font-size:15px; font-weight:800; padding:5px 14px; border-radius:999px;
    color:var(--c,#2563eb); background:color-mix(in srgb, var(--c,#2563eb) 14%, #fff);
    border:1px solid color-mix(in srgb, var(--c,#2563eb) 38%, transparent); }
  .tv-pill.off{ --c:#5a6b86; }
  .tv-sub-rot{ font-size:15px; font-weight:800; color:var(--txt3); text-transform:uppercase; letter-spacing:.06em; margin:10px 0 4px; }
  .tv-sub-rot:first-child{ margin-top:0; }
  .tv-sub-rot b{ color:var(--txt); }
  .tv-vazio{ color:var(--txt3); font-size:20px; text-align:center; padding:40px 6px; line-height:1.5; }
  .tv-vazio small{ font-size:15px; }

  /* tela Rompimentos: cards com os logins caídos */
  .tv-rm-grade{ display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height:0; }
  .tv-rm-card{ background:var(--card); border:1px solid var(--borda); border-radius:18px; padding:12px 20px; overflow:hidden; }
  .tv-rm-topo{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .tv-rm-alvo{ font-size:19px; font-weight:800; }
  .tv-rm-hora{ margin-left:auto; color:var(--txt3); font-size:14px; }
  .tv-rm-lista{ list-style:none; margin:0; padding:0; }
  .tv-rm-lista li{ display:flex; align-items:baseline; gap:12px; padding:6px 0; border-bottom:1px solid var(--borda); font-size:16px; }
  .tv-rm-lista li:last-child{ border-bottom:none; }
  .tv-rm-cli{ font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .tv-rm-log{ color:var(--txt2); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; flex:none; }
  .tv-os-sem{ color:var(--vermelho); font-weight:800; flex:none; }
  .tv-os-nag{ color:var(--amarelo); font-weight:700; flex:none; }
  .tv-os-ag{ color:var(--verde); font-weight:700; flex:none; }
  .tv-rm-mais{ color:var(--txt3); justify-content:center; }

  /* barras (por assunto / cidade) */
  .tv-barras{ display:flex; flex-direction:column; gap:14px; }
  .tv-barra{ display:grid; grid-template-columns:34% 1fr auto; align-items:center; gap:16px; }
  .tv-barra-rot{ font-size:19px; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tv-barra-trilho{ height:20px; background:var(--bg2); border-radius:999px; overflow:hidden; }
  .tv-barra-trilho i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#2563eb,#60a5fa); }
  .tv-barra-n{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; min-width:3ch; text-align:right; }

  /* ---------- tela Panorama (infográfico estilo COP) ---------- */
  .tv-panorama{ display:grid; grid-template-columns:320px 1fr; gap:24px; align-items:stretch; }
  .tv-pan-donut{ background:var(--card); border:1px solid var(--borda); border-radius:18px; padding:22px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .tv-donut{ width:230px; height:230px; }
  .tv-donut-n{ font-size:46px; font-weight:800; fill:var(--txt); }
  .tv-donut-s{ font-size:16px; fill:var(--txt2); }
  .tv-pan-leg{ margin-top:12px; }
  .tv-pan-leg strong{ display:block; font-size:30px; font-weight:800; color:var(--verde); }
  .tv-pan-leg span{ font-size:14px; color:var(--txt2); }
  .tv-pan-linhas{ background:var(--card); border:1px solid var(--borda); border-radius:18px; padding:18px 26px; display:flex; flex-direction:column; justify-content:center; gap:13px; }
  .tv-line{ display:grid; grid-template-columns:auto 240px auto 1fr; align-items:center; gap:14px; }
  .tv-line-dot{ width:13px; height:13px; border-radius:999px; flex:none; }
  .tv-line-rot{ font-size:18px; font-weight:600; }
  .tv-line-val{ font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; text-align:right; min-width:3ch; }
  .tv-line-bar{ height:14px; background:var(--bg2); border-radius:999px; overflow:hidden; }
  .tv-line-bar i{ display:block; height:100%; border-radius:999px; }

  /* ---------- tela Painel geral (tudo numa tela só) ---------- */
  .tv-geral{ display:flex; flex-direction:column; gap:14px; min-height:0; }
  .tvg-kpis{ display:grid; grid-template-columns:repeat(9,1fr); gap:10px; }
  .tvg-kpi{ background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:10px 13px; }
  .tvg-kpi.perigo{ border-color:#f0b4b4; background:linear-gradient(180deg,#fdeaea,#fff); }
  .tvg-kpi .n{ font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .tvg-kpi.perigo .n{ color:var(--vermelho); }
  .tvg-kpi .r{ font-size:12px; color:var(--txt2); margin-top:4px; }
  .tvg-grade{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; gap:14px; min-height:0; }
  .tvg-card{ background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:10px 16px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .tvg-card h3{ font-size:14px; margin:0 0 6px; display:flex; align-items:center; gap:6px; }
  .tvg-ext{ margin-left:auto; font-size:11px; color:var(--txt3); font-weight:700; }
  .tvg-corpo{ flex:1; min-height:0; overflow:hidden; }
  .tvg-li{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--borda); font-size:14px; }
  .tvg-li:last-child{ border-bottom:none; }
  .tvg-li .nome{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .tvg-li .tag{ flex:none; font-size:12.5px; font-weight:800; }
  .tvg-corpo .tv-barras{ gap:7px; }
  .tvg-corpo .tv-barra{ grid-template-columns:38% 1fr auto; gap:10px; }
  .tvg-corpo .tv-barra-rot{ font-size:13px; }
  .tvg-corpo .tv-barra-trilho{ height:12px; }
  .tvg-corpo .tv-barra-n{ font-size:14px; min-width:2ch; }
  .tvg-corpo .tv-vazio{ font-size:14px; padding:14px 6px; }

  /* ---------- rodapé + dots ---------- */
  .tv-rodape{ display:flex; align-items:center; gap:14px; padding:10px 2px 2px; color:var(--txt3); font-size:13px; }
  .tv-ponto{ width:9px; height:9px; border-radius:999px; background:var(--verde); box-shadow:0 0 0 4px rgba(52,211,153,.18); }
  .tv-dots{ display:flex; gap:7px; }
  .tv-dot{ width:9px; height:9px; border-radius:999px; border:none; background:var(--borda); cursor:pointer; padding:0; transition:width .2s; }
  .tv-dot.ativo{ background:var(--azul); width:22px; }
  .tv-pausa{ color:var(--amarelo); font-weight:700; }
  .tv-rodape button:not(.tv-dot){ background:none; border:1px solid var(--borda); color:var(--txt2); border-radius:8px; padding:5px 11px; font-size:13px; cursor:pointer; }
  .tv-rodape button:not(.tv-dot):hover{ color:var(--txt); border-color:var(--txt3); }
  #tvGira.parado{ color:var(--amarelo); border-color:var(--amarelo); font-weight:700; }
  .tv-zoom{ display:flex; align-items:center; gap:6px; }
  .tv-zoom button{ font-weight:800; min-width:34px; }
  #tvZoomVal{ font-size:12px; min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
  .tv-rodape .dir{ margin-left:auto; display:flex; gap:8px; }

  @media (max-width:1100px){
    .tv-kpis{ grid-template-columns:repeat(2,1fr); }
    .tv-duas,.tv-rm-grade,.tv-tres{ grid-template-columns:1fr; }
    .tv-panorama{ grid-template-columns:1fr; }
    .tv-line{ grid-template-columns:auto 1fr auto; }
    .tv-line-bar{ display:none; }
    .tvg-kpis{ grid-template-columns:repeat(4,1fr); }
    .tvg-grade{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

  <!-- Gate de login (uma vez por TV; a sessão fica salva no navegador) -->
  <div id="tvLogin" hidden>
    <form class="tv-login-card" id="tvLoginForm">
      <h1>COP · Operação ao vivo</h1>
      <p>Entre uma vez nesta TV. A sessão fica salva no navegador.</p>
      <div id="tvLoginErro" hidden></div>
      <label for="tvEmail">E-mail</label>
      <input type="email" id="tvEmail" autocomplete="username" required>
      <label for="tvSenha">Senha</label>
      <div class="tv-senha-wrap">
        <input type="password" id="tvSenha" autocomplete="current-password" required>
        <button type="button" id="tvVerSenha" aria-label="Mostrar senha" title="Mostrar/ocultar senha">👁</button>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <!-- Painel -->
  <div id="tvPainel" hidden>
    <div class="tv-topo">
      <div class="tv-marca">COP <small>Operação ao vivo</small></div>
      <div id="tvSlideTitulo" class="tv-slide-titulo">—</div>
      <div class="tv-topo-dir">
        <div id="tvRelogio">--:--</div>
        <div id="tvData">—</div>
      </div>
    </div>

    <div id="tvErro" hidden></div>
    <div id="tvPalco" class="tv-palco"></div>

    <div class="tv-rodape">
      <span class="tv-ponto"></span>
      <span id="tvAtualizado">conectando…</span>
      <span id="tvDots" class="tv-dots"></span>
      <span class="dir">
        <span class="tv-zoom">
          <button type="button" id="tvZoomMenos" title="Diminuir (tecla −)">A−</button>
          <span id="tvZoomVal">100%</span>
          <button type="button" id="tvZoomMais" title="Aumentar (tecla +)">A+</button>
        </span>
        <button type="button" id="tvGira">⏸ Parar nesta tela</button>
        <button type="button" id="tvFull">⛶ Tela cheia</button>
        <button type="button" id="tvSair">Sair</button>
      </span>
    </div>
  </div>

  <!-- Supabase + motores reaproveitados do app + lógica da TV -->
  <script src="js/config/supabase.js"></script>
  <script src="js/agendador/motor.js?v=36"></script>
  <script src="js/engine/prioridadeengine.js?v=1"></script>
  <script src="js/ui/tv.js?v=7"></script>
  <script src="js/ui/rompimentos.js?v=2"></script>
</body>
</html>
