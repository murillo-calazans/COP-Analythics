<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatos dos Técnicos</title>
<!-- Os telefones NÃO ficam neste arquivo (o repositório é público): vêm do Supabase,
     tabela configuracoes_app, chave "contatos_tecnicos", e só aparecem com login do COP. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
    integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
    crossorigin="anonymous"></script>
<script src="js/config/supabase.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --borda:#e2e6ec; --texto:#1f2530; --mudo:#6b7586;
    --azul:#1e40af; --verde:#15803d; --verde-bg:#dcfce7; --vermelho:#b91c1c; --vermelho-bg:#fee2e2;
    --eq-interno:#e0e7ff; --eq-veloz:#fee2e2; --eq-azul:#dbeafe; --eq-technomais:#fef3c7; --eq-outra:#eef1f5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d; --card:#1b2029; --borda:#2c3340; --texto:#e6e9ef; --mudo:#94a0b3;
      --azul:#93c5fd; --verde:#86efac; --verde-bg:#14391f; --vermelho:#fca5a5; --vermelho-bg:#4a2020;
      --eq-interno:#27305a; --eq-veloz:#4a2020; --eq-azul:#1e3a5f; --eq-technomais:#3d3310; --eq-outra:#262c37;
    }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--texto); font:14px/1.4 "Segoe UI",system-ui,sans-serif; }
  header{ padding:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
          background:var(--card); border-bottom:1px solid var(--borda); }
  h1{ margin:0; font-size:19px; }
  .sub{ color:var(--mudo); font-size:12px; }
  .barra{ display:flex; flex-wrap:wrap; gap:8px; }
  .filtros{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; }
  input,select,button{ font:inherit; color:inherit; }
  input,select{ padding:7px 10px; border:1px solid var(--borda); border-radius:8px; background:var(--card); }
  #busca{ flex:1; min-width:200px; max-width:360px; }
  .btn{ padding:6px 10px; border-radius:8px; border:1px solid var(--borda); background:var(--card); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .btn:hover{ border-color:var(--azul); }
  .btn-prim{ background:var(--azul); color:#fff; border-color:var(--azul); }
  @media (prefers-color-scheme: dark){ .btn-prim{ color:#0b1220; } }
  .btn-wa{ color:var(--verde); }
  .btn-x{ color:var(--vermelho); }
  .aviso{ margin:0 16px 8px; padding:9px 12px; border-radius:8px; background:var(--verde-bg); color:var(--verde); font-size:13px; }
  .aviso.erro{ background:var(--vermelho-bg); color:var(--vermelho); }
  main{ padding:0 16px 32px; }
  .cidade{ margin-top:14px; }
  .cidade h2{ font-size:13px; margin:0 0 6px; color:var(--mudo); text-transform:uppercase; letter-spacing:.04em; }
  .lista{ background:var(--card); border:1px solid var(--borda); border-radius:10px; overflow:hidden; }
  .linha{ display:grid; grid-template-columns:minmax(200px,1.5fr) minmax(150px,1fr) minmax(140px,1fr) auto; gap:10px;
          align-items:center; padding:9px 12px; border-top:1px solid var(--borda); }
  .linha:first-child{ border-top:0; }
  .nome{ font-weight:600; }
  .meta{ color:var(--mudo); font-size:12px; }
  .tag{ display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; margin-left:6px; vertical-align:1px; font-weight:500; background:var(--eq-outra); }
  .tag.interno{ background:var(--eq-interno); } .tag.veloz{ background:var(--eq-veloz); }
  .tag.azul{ background:var(--eq-azul); } .tag.technomais{ background:var(--eq-technomais); }
  .tel{ font-variant-numeric:tabular-nums; font-size:15px; }
  .tel.vazio{ color:var(--mudo); font-style:italic; font-size:13px; }
  .acoes{ display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .edit{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; grid-column:1/-1; }
  .edit label{ display:grid; gap:3px; font-size:12px; color:var(--mudo); }
  .edit input{ background:var(--bg); }
  .vazio-geral{ color:var(--mudo); padding:14px 0; }
  .hidden{ display:none !important; }
  #login{ position:fixed; inset:0; background:rgba(20,24,32,.92); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #login form{ background:var(--card); padding:22px; border-radius:12px; width:100%; max-width:340px; display:grid; gap:10px; }
  #login input{ background:var(--bg); }
  @media (max-width:720px){
    .linha{ grid-template-columns:1fr; gap:6px; }
    .acoes{ justify-content:flex-start; }
    #busca{ max-width:none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Contatos dos Técnicos</h1>
    <div class="sub" id="subtitulo">Carregando…</div>
  </div>
  <div class="barra">
    <button class="btn hidden so-admin" id="btnNovo" type="button">＋ Novo técnico</button>
    <button class="btn hidden so-admin" id="btnImportar" type="button" title="Carrega a lista de um arquivo 'Contatos dos técnicos.html' ou .csv">⬆ Importar arquivo</button>
    <input type="file" id="arquivo" accept=".html,.htm,.csv" hidden>
    <button class="btn" id="btnCopiar" type="button" title="Copia nome e telefone de quem está no filtro">📋 Copiar lista</button>
    <button class="btn" id="btnCsv" type="button" title="Baixa uma planilha (abre no Excel)">⬇ Exportar planilha</button>
    <a class="btn" href="index.html">← COP Analytics</a>
  </div>
</header>

<div class="filtros">
  <input type="search" id="busca" placeholder="Buscar nome ou telefone…">
  <select id="fCidade"></select>
  <select id="fEquipe"></select>
  <select id="fTel">
    <option value="">Com e sem telefone</option>
    <option value="sem">Só sem telefone</option>
    <option value="com">Só com telefone</option>
  </select>
</div>
<div class="aviso hidden" id="aviso"></div>
<main id="conteudo"></main>

<div id="login" class="hidden">
  <form id="loginForm">
    <strong>Entrar no COP Analytics</strong>
    <input type="email" id="loginEmail" placeholder="E-mail" required autocomplete="username">
    <input type="password" id="loginSenha" placeholder="Senha" required autocomplete="current-password">
    <div class="aviso erro hidden" id="loginErro" style="margin:0"></div>
    <button class="btn btn-prim" type="submit">Entrar</button>
  </form>
</div>

<script>
(function(){
  "use strict";
  var CHAVE = "contatos_tecnicos"; // configuracoes_app: { lista: [{nome, telefone, equipe, cidade, obs}] }
  var $ = function(id){ return document.getElementById(id); };

  var lista = [];
  var papel = null;
  var atualizadoEm = null, atualizadoPor = null;
  var editando = null;
  var seq = 0;

  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var dig = function(s){ return String(s || "").replace(/\D/g, ""); };
  var cmp = function(a, b){ return String(a).localeCompare(String(b), "pt-BR"); };
  var podeEditar = function(){ return papel === "admin"; };
  var comId = function(t){ return { id: "t" + (++seq), nome: t.nome || "", telefone: t.telefone || "", equipe: t.equipe || "", cidade: t.cidade || "", obs: t.obs || "" }; };

  function formatarTel(s){
    var d = dig(s);
    if(d.length === 13 && d.indexOf("55") === 0) d = d.slice(2);
    if(d.length === 11) return "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
    if(d.length === 10) return "(" + d.slice(0,2) + ") " + d.slice(2,6) + "-" + d.slice(6);
    return String(s || "").trim();
  }
  function intl(s){ var d = dig(s); return (d.length === 10 || d.length === 11) ? "55" + d : d; }

  function aviso(msg, erro){
    var el = $("aviso"); el.textContent = msg || ""; el.classList.toggle("hidden", !msg); el.classList.toggle("erro", !!erro);
    clearTimeout(aviso.t); if(msg && !erro) aviso.t = setTimeout(function(){ el.classList.add("hidden"); }, 6000);
  }

  // ---------- banco ----------
  function carregar(){
    return supabaseClient.from("configuracoes_app").select("valor, atualizado_em, atualizado_por").eq("chave", CHAVE).maybeSingle()
      .then(function(res){
        if(res.error) throw res.error;
        var v = res.data && res.data.valor;
        lista = (v && Array.isArray(v.lista) ? v.lista : []).map(comId);
        atualizadoEm = res.data ? res.data.atualizado_em : null;
        atualizadoPor = res.data ? res.data.atualizado_por : null;
        render();
      })
      .catch(function(err){ aviso("Falha ao carregar os contatos: " + (err.message || err), true); $("subtitulo").textContent = ""; });
  }

  function gravar(novaLista, msgOk){
    var limpos = novaLista.filter(function(t){ return !t.novo; }).map(function(t){
      return { nome: t.nome, telefone: t.telefone, equipe: t.equipe, cidade: t.cidade, obs: t.obs };
    });
    return supabaseClient.auth.getUser().then(function(u){
      var quem = u.data && u.data.user ? u.data.user.email : null;
      var agora = new Date().toISOString();
      return supabaseClient.from("configuracoes_app")
        .upsert({ chave: CHAVE, valor: { lista: limpos }, atualizado_em: agora, atualizado_por: quem })
        .then(function(res){
          if(res.error){ aviso("Não foi possível salvar: " + res.error.message, true); return false; }
          lista = novaLista.filter(function(t){ return !t.novo; });
          atualizadoEm = agora; atualizadoPor = quem;
          editando = null; render();
          if(msgOk) aviso(msgOk);
          return true;
        });
    });
  }

  // ---------- tela ----------
  function opcoes(sel, rotuloTodos, valores){
    var atual = sel.value;
    sel.innerHTML = '<option value="">' + rotuloTodos + '</option>' + valores.map(function(v){ return '<option' + (v === atual ? " selected" : "") + '>' + esc(v) + '</option>'; }).join("");
  }
  function unicos(campo){ return Array.from(new Set(lista.map(function(t){ return t[campo]; }).filter(Boolean))).sort(cmp); }

  function filtrados(){
    var q = $("busca").value.trim().toLowerCase(), qd = dig(q);
    var c = $("fCidade").value, e = $("fEquipe").value, f = $("fTel").value;
    return lista.filter(function(t){
      if(t.novo) return true;
      if(c && t.cidade !== c) return false;
      if(e && t.equipe !== e) return false;
      if(f === "sem" && t.telefone) return false;
      if(f === "com" && !t.telefone) return false;
      if(q && t.nome.toLowerCase().indexOf(q) === -1 && (t.obs || "").toLowerCase().indexOf(q) === -1 && !(qd && dig(t.telefone).indexOf(qd) !== -1)) return false;
      return true;
    });
  }

  function linhaHtml(t){
    if(editando === t.id){
      return '<div class="linha"><div class="edit">' +
        '<label>Nome<input id="eNome" value="' + esc(t.nome) + '"></label>' +
        '<label>Telefone<input id="eTel" type="tel" value="' + esc(t.telefone) + '" placeholder="(22) 99999-9999"></label>' +
        '<label>Equipe<input id="eEquipe" list="lEquipes" value="' + esc(t.equipe) + '"></label>' +
        '<label>Cidade<input id="eCidade" list="lCidades" value="' + esc(t.cidade) + '"></label>' +
        '<label>Observação<input id="eObs" value="' + esc(t.obs) + '" placeholder="ex.: NOF 01, só WhatsApp"></label>' +
        '</div><div class="acoes" style="grid-column:1/-1">' +
        (t.novo ? '' : '<button class="btn btn-x" data-a="remover" data-id="' + esc(t.id) + '">Remover técnico</button>') +
        '<button class="btn" data-a="cancelar">Cancelar</button>' +
        '<button class="btn btn-prim" data-a="salvar" data-id="' + esc(t.id) + '">Salvar</button></div></div>';
    }
    var acoes = [];
    if(t.telefone){
      acoes.push('<a class="btn" href="tel:+' + esc(intl(t.telefone)) + '">📞 Ligar</a>');
      acoes.push('<a class="btn btn-wa" href="https://wa.me/' + esc(intl(t.telefone)) + '" target="_blank" rel="noopener">WhatsApp</a>');
    }
    if(podeEditar()) acoes.push('<button class="btn" data-a="editar" data-id="' + esc(t.id) + '" title="Editar">✏️</button>');
    return '<div class="linha">' +
      '<div><span class="nome">' + esc(t.nome) + '</span><span class="tag ' + esc(String(t.equipe || "").toLowerCase()) + '">' + esc(t.equipe || "—") + '</span></div>' +
      (t.telefone ? '<div class="tel">' + esc(formatarTel(t.telefone)) + '</div>' : '<div class="tel vazio">sem telefone</div>') +
      '<div class="meta">' + esc(t.obs || "") + '</div>' +
      '<div class="acoes">' + acoes.join("") + '</div></div>';
  }

  function render(){
    document.querySelectorAll(".so-admin").forEach(function(el){ el.classList.toggle("hidden", !podeEditar()); });
    opcoes($("fCidade"), "Todas as cidades", unicos("cidade"));
    opcoes($("fEquipe"), "Todas as equipes", unicos("equipe"));
    var reais = lista.filter(function(t){ return !t.novo; });
    var comTel = reais.filter(function(t){ return t.telefone; }).length;
    $("subtitulo").textContent = reais.length + " técnicos · " + comTel + " com telefone" +
      (atualizadoEm ? " · atualizado em " + new Date(atualizadoEm).toLocaleString("pt-BR") + (atualizadoPor ? " por " + atualizadoPor : "") : "") +
      (podeEditar() ? "" : " · só administrador edita");

    if(!reais.length && !editando){
      $("conteudo").innerHTML = '<p class="vazio-geral">Nenhum contato cadastrado ainda.' +
        (podeEditar() ? ' Use <b>⬆ Importar arquivo</b> para carregar o "Contatos dos técnicos.html" ou uma planilha .csv.' : '') + '</p>';
      return;
    }

    var grupos = {};
    filtrados().forEach(function(t){ var k = t.novo ? "Novo técnico" : (t.cidade || "Sem cidade"); (grupos[k] = grupos[k] || []).push(t); });
    var nomes = Object.keys(grupos).sort(function(a, b){ return a === "Novo técnico" ? -1 : b === "Novo técnico" ? 1 : cmp(a, b); });
    $("conteudo").innerHTML =
      '<datalist id="lEquipes">' + unicos("equipe").map(function(v){ return '<option value="' + esc(v) + '">'; }).join("") + '</datalist>' +
      '<datalist id="lCidades">' + unicos("cidade").map(function(v){ return '<option value="' + esc(v) + '">'; }).join("") + '</datalist>' +
      (nomes.length ? nomes.map(function(c){
        var linhas = grupos[c].sort(function(a,b){ return cmp(a.nome, b.nome); }).map(linhaHtml).join("");
        return '<section class="cidade"><h2>' + esc(c) + ' · ' + grupos[c].length + '</h2><div class="lista">' + linhas + '</div></section>';
      }).join("") : '<p class="vazio-geral">Nenhum técnico encontrado.</p>');

    if(editando){
      document.querySelectorAll(".edit input").forEach(function(inp){
        inp.addEventListener("keydown", function(e){
          if(e.key === "Enter") salvar(editando);
          if(e.key === "Escape") cancelar();
        });
      });
    }
  }

  function cancelar(){ lista = lista.filter(function(x){ return !x.novo; }); editando = null; render(); }

  function salvar(id){
    var t = lista.find(function(x){ return x.id === id; }); if(!t) return;
    var nome = $("eNome").value.trim();
    if(!nome){ alert("Informe o nome do técnico."); return; }
    var novo = lista.map(function(x){
      if(x.id !== id) return x;
      return { id: x.id, nome: nome, telefone: formatarTel($("eTel").value), equipe: $("eEquipe").value.trim(), cidade: $("eCidade").value.trim(), obs: $("eObs").value.trim() };
    });
    gravar(novo, "Salvo. Todo mundo do COP já vê a alteração.");
  }

  $("conteudo").addEventListener("click", function(e){
    var b = e.target.closest("[data-a]"); if(!b) return;
    var a = b.getAttribute("data-a"), id = b.getAttribute("data-id");
    if(a === "editar"){ lista = lista.filter(function(x){ return !x.novo; }); editando = id; render(); var f = $("eTel"); if(f) f.focus(); }
    if(a === "cancelar") cancelar();
    if(a === "salvar") salvar(id);
    if(a === "remover"){
      var r = lista.find(function(x){ return x.id === id; });
      if(r && confirm('Remover "' + r.nome + '" da lista?')) gravar(lista.filter(function(x){ return x !== r; }), "Técnico removido.");
    }
  });
  ["busca","fCidade","fEquipe","fTel"].forEach(function(id){ $(id).addEventListener("input", render); });

  $("btnNovo").addEventListener("click", function(){
    lista = lista.filter(function(x){ return !x.novo; });
    var t = comId({ equipe: "Interno", cidade: $("fCidade").value || "" }); t.novo = true;
    lista.push(t); editando = t.id;
    render(); $("eNome").focus(); window.scrollTo(0, 0);
  });

  // ---------- importar (HTML local "Contatos dos técnicos.html" ou CSV exportado) ----------
  function lerCsv(txt){
    var linhas = txt.replace(/^﻿/, "").split(/\r?\n/).filter(function(l){ return l.trim(); });
    var sep = (linhas[0] || "").indexOf(";") !== -1 ? ";" : ",";
    var celulas = function(l){
      var out = [], cur = "", aspas = false;
      for(var i = 0; i < l.length; i++){
        var ch = l[i];
        if(aspas){ if(ch === '"' && l[i+1] === '"'){ cur += '"'; i++; } else if(ch === '"') aspas = false; else cur += ch; }
        else if(ch === '"') aspas = true; else if(ch === sep){ out.push(cur); cur = ""; } else cur += ch;
      }
      out.push(cur); return out.map(function(s){ return s.trim(); });
    };
    var cab = celulas(linhas[0]).map(function(h){ return h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); });
    var col = function(nomes){ for(var i = 0; i < cab.length; i++) if(nomes.some(function(n){ return cab[i].indexOf(n) === 0; })) return i; return -1; };
    var iN = col(["nome","tecnico"]), iT = col(["telefone","celular","fone"]), iE = col(["equipe"]), iC = col(["cidade"]), iO = col(["obs"]);
    if(iN < 0) throw new Error("a planilha precisa de uma coluna 'Nome'");
    return linhas.slice(1).map(celulas).map(function(c){
      return { nome: c[iN] || "", telefone: iT >= 0 ? formatarTel(c[iT]) : "", equipe: iE >= 0 ? c[iE] : "", cidade: iC >= 0 ? c[iC] : "", obs: iO >= 0 ? c[iO] : "" };
    }).filter(function(t){ return t.nome; });
  }
  function lerHtml(txt){
    var m = txt.match(/<script id="dados" type="application\/json">([\s\S]*?)<\/script>/);
    if(!m) throw new Error("esse HTML não é o arquivo de contatos");
    var d = JSON.parse(m[1]);
    return (d.lista || []).filter(function(t){ return t && t.nome; });
  }

  $("btnImportar").addEventListener("click", function(){ $("arquivo").value = ""; $("arquivo").click(); });
  $("arquivo").addEventListener("change", function(){
    var f = this.files[0]; if(!f) return;
    f.text().then(function(txt){
      var novos;
      try{ novos = /\.csv$/i.test(f.name) ? lerCsv(txt) : lerHtml(txt); }
      catch(err){ aviso("Não deu para ler o arquivo: " + err.message, true); return; }
      if(!novos.length){ aviso("O arquivo não tem nenhum técnico.", true); return; }
      var msg = 'Importar ' + novos.length + ' técnicos de "' + f.name + '"?' +
        (lista.length ? "\n\nA lista atual (" + lista.length + " técnicos) será SUBSTITUÍDA por essa." : "");
      if(!confirm(msg)) return;
      gravar(novos.map(comId), novos.length + " técnicos importados.");
    });
  });

  // ---------- exportar ----------
  $("btnCopiar").addEventListener("click", function(){
    var itens = filtrados().filter(function(t){ return !t.novo; }).sort(function(a,b){ return cmp(a.nome, b.nome); });
    var txt = itens.map(function(t){ return t.nome + " — " + (t.telefone ? formatarTel(t.telefone) : "sem telefone"); }).join("\n");
    navigator.clipboard.writeText(txt).then(function(){ aviso("Lista copiada (" + itens.length + " técnicos)."); },
      function(){ aviso("Não deu para copiar automaticamente neste navegador.", true); });
  });

  $("btnCsv").addEventListener("click", function(){
    var q = function(v){ return '"' + String(v || "").replace(/"/g, '""') + '"'; };
    var linhas = [["Nome","Telefone","Equipe","Cidade","Observação"].map(q).join(";")]
      .concat(lista.filter(function(t){ return !t.novo; }).sort(function(a,b){ return cmp(a.nome, b.nome); })
      .map(function(t){ return [t.nome, formatarTel(t.telefone), t.equipe, t.cidade, t.obs].map(q).join(";"); }));
    var url = URL.createObjectURL(new Blob(["﻿" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" }));
    var a = document.createElement("a"); a.href = url; a.download = "Contatos dos técnicos.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  // ---------- login (mesma sessão do COP Analytics) ----------
  function iniciar(sessao){
    if(!sessao){ $("login").classList.remove("hidden"); $("subtitulo").textContent = ""; return; }
    $("login").classList.add("hidden");
    supabaseClient.from("perfis").select("papel").eq("id", sessao.user.id).maybeSingle().then(function(res){
      papel = res.data ? res.data.papel : null;
      if(!papel){ aviso("Seu usuário não tem acesso cadastrado no COP Analytics.", true); $("subtitulo").textContent = ""; return; }
      carregar();
    });
  }

  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    supabaseClient.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginSenha").value }).then(function(res){
      if(res.error){ $("loginErro").textContent = "E-mail ou senha inválidos."; $("loginErro").classList.remove("hidden"); return; }
      iniciar(res.data.session);
    });
  });

  supabaseClient.auth.getSession().then(function(r){ iniciar(r.data.session); });
})();
</script>
</body>
</html>
