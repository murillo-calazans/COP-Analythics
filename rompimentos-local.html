<!DOCTYPE html>
<html lang="pt-BR" data-tema="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rompimentos</title>
<!-- Versão SEM banco (temporária, enquanto o Supabase está fora): o robô grava
     rompimentos-dados.js nesta mesma pasta a cada ~10 min. Abra direto do disco. -->
<style>
  /* variáveis que o CSS dos cartões (js/ui/rompimentos.js) usa */
  :root{ --cor-fundo:#eef1f7; --cor-superficie:#fff; --cor-borda:#dbe2ee; --cor-texto:#1e2a3e; --cor-texto-suave:#5a6b86; --cor-primaria:#2563eb; }
  html[data-tema="dark"]{ --cor-fundo:#0b1424; --cor-superficie:#0f1a2e; --cor-borda:#22314d; --cor-texto:#e6edf7; --cor-texto-suave:#8a9bb5; --cor-primaria:#60a5fa; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--cor-fundo); color:var(--cor-texto); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .pagina{ max-width:1300px; margin:0 auto; padding:18px 20px 30px; }
  .topo{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .topo h1{ margin:0; font-size:24px; font-weight:800; }
  .topo h1 small{ display:block; font-size:12px; font-weight:700; color:var(--cor-texto-suave); letter-spacing:.08em; text-transform:uppercase; }
  #romplAtualizado{ color:var(--cor-texto-suave); font-size:13px; }
  .topo .dir{ margin-left:auto; }
  .btn{ font:inherit; background:none; border:1px solid var(--cor-borda); color:var(--cor-texto-suave); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  #romplAviso{ background:#fde4e4; color:#991b1b; border:1px solid #f1b4b4; padding:8px 14px; border-radius:10px; font-size:14px; margin-bottom:12px; }
  #romplKpis{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--cor-superficie); border:1px solid var(--cor-borda); border-radius:12px; padding:12px 14px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--k,var(--cor-borda)); }
  .kpi .n{ display:block; font-size:28px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .kpi .r{ display:block; font-size:13px; color:var(--cor-texto-suave); margin-top:6px; }
  .k-romp{ --k:#dc2626; } .k-energia{ --k:#d97706; } .k-outro{ --k:#64748b; } .k-cli{ --k:#2563eb; } .k-semos{ --k:#dc2626; } .k-total{ --k:#64748b; }
  #romplCaixa .ixc-popup-corpo{ background:var(--cor-superficie); border:1px solid var(--cor-borda); border-radius:14px; padding:14px 16px; }
  #romplCaixa .romp-card{ background:var(--cor-fundo); }
  .alerta-vazio{ color:var(--cor-texto-suave); text-align:center; padding:30px; font-size:15px; }
  @media (max-width:1000px){ #romplKpis{ grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
  <div class="pagina">
    <div class="topo">
      <h1><small>COP</small>Possíveis rompimentos</h1>
      <span id="romplAtualizado">carregando…</span>
      <span class="dir"><button type="button" class="btn" id="romplBtnTema">☀ Claro</button></span>
    </div>
    <div id="romplAviso" hidden></div>
    <div id="romplKpis"></div>
    <div id="romplCaixa"><div class="ixc-popup-corpo"><p class="alerta-vazio">Carregando…</p></div></div>
  </div>
  <script src="rompimentos-dados.js" id="rompDados"></script>
  <script src="js/ui/romplocal.js?v=1"></script>
  <script src="js/agendador/motor.js?v=36"></script>
  <script src="js/ui/rompimentos.js?v=2"></script>
</body>
</html>
